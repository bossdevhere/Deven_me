<!-- sections/home.html -->
<section id="home" class="w-full pt-20 sm:pt-24 pb-12 sm:pb-16 px-3 sm:px-6 md:px-8">
    <div class="max-w-[1360px] mx-auto">
        <!-- Main Dark Hero Card -->
        <div class="hero-card relative w-full rounded-[28px] sm:rounded-[36px] md:rounded-[46px] bg-[#0a0a08] border border-white/5 overflow-hidden shadow-2xl min-h-[640px] md:min-h-[720px] lg:min-h-[780px] flex flex-col justify-between p-6 sm:p-10 md:p-14 transition-all">
            
            <!-- Hero Portrait Background Layer -->
            <div class="absolute inset-0 w-full h-full pointer-events-none overflow-hidden select-none z-0">
                <!-- Ambient Glow behind portrait -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] h-[650px] bg-gradient-to-tr from-lime-500/10 via-amber-500/5 to-transparent rounded-full blur-[100px] pointer-events-none opacity-60"></div>
                <!-- Clean Studio Portrait Image -->
                <img src="images/hero-clean.png" alt="Deven Rajput - Designer & Developer" class="hero-portrait-img absolute inset-0 w-full h-full object-cover md:object-cover object-center select-none transition-transform duration-700 ease-out">
                <!-- Subtle vignette gradient to ensure perfect text readability on all resolutions -->
                <div class="absolute inset-0 bg-gradient-to-r from-[#0a0a08]/90 via-[#0a0a08]/40 to-transparent lg:from-[#0a0a08]/70 lg:via-transparent pointer-events-none"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a08]/80 via-transparent to-transparent md:hidden pointer-events-none"></div>
            </div>

            <!-- Top Row: Floating EXP in Widget on the Right -->
            <div class="relative z-10 flex justify-end w-full">
                <!-- EXP in : Glassmorphic Widget Card -->
                <div class="hero-exp-card bg-[#141514]/85 backdrop-blur-md border border-white/10 rounded-2xl p-4 sm:p-5 shadow-2xl max-w-[210px] sm:max-w-[230px] w-full transition-all duration-300 hover:border-white/20 hover:shadow-[#d4f742]/5">
                    <div class="text-[11px] font-semibold tracking-wider text-gray-400 uppercase mb-3 text-center sm:text-left font-sans">EXP in :</div>
                    <div class="flex flex-col gap-2.5">
                        <!-- Row 1: Sketch, Framer/Lightning (Highlighted in white circle), Figma -->
                        <div class="flex items-center justify-between gap-2">
                            <!-- Sketch / Diamond -->
                            <div class="exp-icon-item w-10 h-10 rounded-xl bg-white/[0.06] hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all duration-200 cursor-pointer hover:scale-105" title="Sketch">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="6 3 18 3 22 9 12 22 2 9 6 3"></polygon>
                                    <polyline points="2 9 12 22 22 9"></polyline>
                                    <polyline points="12 2 12 22"></polyline>
                                </svg>
                            </div>
                            <!-- Framer / Thunder (Solid White circle with black bolt, exactly as in image) -->
                            <div class="exp-icon-item w-10 h-10 rounded-full bg-white text-black flex items-center justify-center shadow-lg shadow-white/20 transition-all duration-200 cursor-pointer hover:scale-110" title="Framer">
                                <svg class="w-5 h-5 fill-black" viewBox="0 0 24 24">
                                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                                </svg>
                            </div>
                            <!-- Figma -->
                            <div class="exp-icon-item w-10 h-10 rounded-xl bg-white/[0.06] hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white transition-all duration-200 cursor-pointer hover:scale-105" title="Figma">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 2a4 4 0 0 0-4 4 4 4 0 0 0 4 4h4V2H8zm8 0h-4v8h4a4 4 0 0 0 0-8zm-8 8a4 4 0 0 0-4 4 4 4 0 0 0 4 4h4v-8H8zm8 0a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 0-8zm-8 8a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4v-4H8z"/>
                                </svg>
                            </div>
                        </div>

                        <!-- Row 2: Webflow, After Effects -->
                        <div class="flex items-center gap-2">
                            <!-- Webflow -->
                            <div class="exp-icon-item w-10 h-10 rounded-xl bg-white/[0.06] hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white font-bold text-xs tracking-tighter transition-all duration-200 cursor-pointer hover:scale-105" title="Webflow">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                    <path d="M19.14 7.5L15.68 15.28L12.56 7.5H8.8L12.38 16.5H8.73L6.15 7.5H2L5.85 19H9.98L13.56 10.95L17.14 19H22L19.14 7.5Z"/>
                                </svg>
                            </div>
                            <!-- After Effects -->
                            <div class="exp-icon-item w-10 h-10 rounded-xl bg-white/[0.06] hover:bg-white/10 border border-white/10 flex items-center justify-center text-gray-300 hover:text-white font-bold text-xs transition-all duration-200 cursor-pointer hover:scale-105" title="Adobe After Effects">
                                <span class="font-sans font-extrabold text-[13px] tracking-tight">Ae</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle / Left Content: Greeting, Headline, Hire Me Button -->
            <div class="relative z-10 my-auto py-6 sm:py-8 max-w-xl">
                <!-- Greeting -->
                <div class="hero-greeting inline-flex items-center gap-2 text-[#d4f742] font-semibold text-base sm:text-lg mb-4">
                    <span>Hey</span>
                    <span class="hero-wave inline-block transform origin-bottom-right">👋</span>
                    <span class="text-white">I'm Deven</span>
                </div>

                <!-- Big Headline -->
                <h1 class="hero-title text-5xl sm:text-6xl md:text-7xl lg:text-[84px] font-extrabold text-white tracking-tight leading-[1.02] mb-8 font-display">
                    <span class="block hero-title-line">App & Web</span>
                    <span class="block hero-title-line">Developer</span>
                </h1>

                <!-- CTA Button -->
                <div class="hero-btn-container">
                    <a href="#contact" class="hero-btn inline-flex items-center justify-center px-8 py-3.5 rounded-full bg-[#d4f742] hover:bg-[#e1fa5c] text-black font-bold text-base sm:text-lg transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg shadow-[#d4f742]/20 group">
                        <span>Hire Me</span>
                    </a>
                </div>
            </div>

            <!-- Bottom Row: Left descriptor paragraph, Right 3-column stats -->
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-end justify-between gap-8 pt-4">
                <!-- Descriptor on Left -->
                <div class="hero-desc max-w-[320px] text-gray-400 text-sm sm:text-[15px] leading-relaxed">
                    <p>App and Web Developer</p>
                    <p>Building scalable mobile & web apps</p>
                    <p>having 0.5+ years of experience.</p>
                </div>

                <!-- 3 Stats Columns on Right -->
                <div class="hero-stats-row grid grid-cols-3 gap-6 sm:gap-10 lg:gap-12 max-w-lg w-full">
                    <!-- Stat 1: 0.5 Year of experience -->
                    <div class="hero-stat-item group cursor-default">
                        <div class="text-3xl sm:text-4xl lg:text-[44px] font-extrabold text-white tracking-tight font-display stat-number" data-target="0.5" data-decimal="true" data-suffix="+">0.5+</div>
                        <div class="text-xs sm:text-sm text-gray-400 mt-1 font-normal">Year of experience</div>
                        <div class="stat-line w-full h-[1px] bg-white/20 mt-3 group-hover:bg-[#d4f742] transition-colors duration-300"></div>
                    </div>

                    <!-- Stat 2: 30+ Projects -->
                    <div class="hero-stat-item group cursor-default">
                        <div class="text-3xl sm:text-4xl lg:text-[44px] font-extrabold text-white tracking-tight font-display stat-number" data-target="30" data-suffix="+">30+</div>
                        <div class="text-xs sm:text-sm text-gray-400 mt-1 font-normal">Projects</div>
                        <div class="stat-line w-full h-[1px] bg-white/20 mt-3 group-hover:bg-[#d4f742] transition-colors duration-300"></div>
                    </div>

                    <!-- Stat 3: 25+ Technologies & Tools -->
                    <div class="hero-stat-item group cursor-default">
                        <div class="text-3xl sm:text-4xl lg:text-[44px] font-extrabold text-white tracking-tight font-display stat-number" data-target="25" data-suffix="+">25+</div>
                        <div class="text-xs sm:text-sm text-gray-400 mt-1 font-normal">Technologies & Tools</div>
                        <div class="stat-line w-full h-[1px] bg-white/20 mt-3 group-hover:bg-[#d4f742] transition-colors duration-300"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
